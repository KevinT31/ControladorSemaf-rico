# Mosquitto — configuración TLS+mTLS de laboratorio (spec §28).
# Lanzar DESDE este directorio (las rutas son relativas al cwd del broker):
#   cd config\nsb\mosquitto
#   mosquitto -c mosquitto.tls.conf -v
# o usar scripts\nsb\mqtt\run_mqtt_broker.ps1 -Tls

per_listener_settings false
allow_anonymous false

listener 8883
cafile certs/ca.crt
certfile certs/server.crt
keyfile certs/server.key

# mTLS: el cliente DEBE presentar cert firmado por la CA de laboratorio.
# Su CN (= node_id) pasa a ser el usuario contra el que evalúa la ACL.
require_certificate true
use_identity_as_username true

acl_file acl.conf

# Higiene de laboratorio
max_queued_messages 1000
message_size_limit 65536
