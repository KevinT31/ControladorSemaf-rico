# Mosquitto — configuración de DESARROLLO (sin TLS, SOLO loopback).
# Para pruebas rápidas locales; el flujo con seguridad real es mosquitto.tls.conf.
#   cd config\nsb\mosquitto
#   mosquitto -c mosquitto.dev.conf -v

listener 1883 127.0.0.1
allow_anonymous true
max_queued_messages 1000
message_size_limit 65536
