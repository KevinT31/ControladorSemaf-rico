# ACL por tópico (spec §28). Con use_identity_as_username=true el "usuario"
# es el CN del certificado de cliente (= node_id).
#
# Cada nodo publicador SOLO escribe bajo su propio prefijo. Las identidades
# se enumeran para que un usuario de solo lectura no herede escritura por un
# `pattern write .../%u/#` global (los pattern aplican a todos los usuarios).
user nsb-node-01
topic write nsb/nsb-node-01/#

user nsb-pi-01
topic write nsb/nsb-pi-01/#

# Observador de laboratorio (dashboard/suscriptor): solo lectura global.
user nsb-observer
topic read nsb/#
