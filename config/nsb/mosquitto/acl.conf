# ACL por tópico (spec §28). Con use_identity_as_username=true el "usuario"
# es el CN del certificado de cliente (= node_id).
#
# Regla general: cada nodo SOLO escribe bajo su propio prefijo nsb/<node_id>/.
# Ninguna identidad tiene write global; no existe tópico de comandos hacia el
# nodo (D-H: ninguna vía MQTT puede elevar el modo de autoridad).
pattern write nsb/%u/#

# Observador de laboratorio (dashboard/suscriptor): solo lectura global.
user nsb-observer
topic read nsb/#
