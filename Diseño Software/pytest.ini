[pytest]
testpaths = tests
markers =
    hardware: requiere Raspberry Pi fisica con GPIO (auto-skip fuera de ARM)
    sumo: requiere SUMO instalado y accesible via traci
    mqtt: requiere broker MQTT accesible en localhost:1883
    slow: test lento (excluir con -m "not slow" en ciclos rapidos)
addopts = -ra
